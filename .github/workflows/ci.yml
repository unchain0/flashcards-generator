name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/python/**'
      - 'frontend/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.env.example'
      - 'alembic.ini'
      - 'migrations/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/python/**'
      - 'frontend/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.env.example'
      - 'alembic.ini'
      - 'migrations/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.x'
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run RUFF linter
        run: uv run ruff check --output-format github .

      - name: Run RUFF format check
        run: uv run ruff format --check .

      - name: Run TY type check
        run: uv run ty check src/flashcards_generator scripts/python/quality_gate.py

      - name: Enforce Radon rank A
        run: uv run task quality-gate

  frontend:
    name: Frontend Quality & E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting, lint, and types
        working-directory: frontend
        run: pnpm run check

      - name: Verify 100% frontend unit coverage
        working-directory: frontend
        run: pnpm run test

      - name: Build Vite+ assets for the backend E2E server
        working-directory: frontend
        run: pnpm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.x'
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install backend runtime for browser E2E
        run: uv sync --frozen --no-dev

      - name: Install Chromium for browser tests
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E
        working-directory: frontend
        run: pnpm run e2e

      - name: Upload compiled frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: src/flashcards_generator/delivery/web/static/dist/
          retention-days: 1

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: src/flashcards_generator/delivery/web/static/dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.x'
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Run tests with coverage
        run: uv run --frozen pytest --cov=flashcards_generator --cov-branch --cov-fail-under=100 --cov-report=xml:coverage.xml --cov-report=json:coverage.json --cov-report=term-missing -v

      - name: Upload machine-readable coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-reports
          path: |
            coverage.json
            coverage.xml
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-and-format, test, frontend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: src/flashcards_generator/delivery/web/static/dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.x'
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run integration tests (mocked)
        run: uv run pytest tests/integration -v -m "not requires_api" --timeout=300

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint-and-format, test, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: src/flashcards_generator/delivery/web/static/dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.x'
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  container-smoke:
    name: Container Smoke
    runs-on: ubuntu-latest
    needs: [lint-and-format, test, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production image
        env:
          SERVICE_PASSWORD_64_POSTGRES: ci-postgres-password
          SERVICE_REALBASE64_64_SESSIONSECRET: ci-smoke-session-secret-0123456789abcdef
          SERVICE_REALBASE64_64_AUTHLOOKUPSECRET: ci-smoke-lookup-secret-0123456789abcdef
          SERVICE_PASSWORD_64_BOOTSTRAP: ci-smoke-password
        run: docker compose --project-name flashcards-ci build --pull

      - name: Verify PostgreSQL production stack
        shell: bash
        run: |
          set -euo pipefail
          export SERVICE_PASSWORD_64_POSTGRES=ci-postgres-password
          export SERVICE_REALBASE64_64_SESSIONSECRET=ci-smoke-session-secret-0123456789abcdef
          export SERVICE_REALBASE64_64_AUTHLOOKUPSECRET=ci-smoke-lookup-secret-0123456789abcdef
          export SERVICE_PASSWORD_64_BOOTSTRAP=ci-smoke-password
          cookie_headers="$RUNNER_TEMP/flashcards-ci-headers"
          compose_override="$RUNNER_TEMP/flashcards-ci.compose.yml"
          cat > "$compose_override" <<'YAML'
          services:
            app:
              ports:
                - "127.0.0.1:18000:8000"
          YAML
          compose=(docker compose --project-name flashcards-ci --file docker-compose.yml --file "$compose_override")
          trap '"${compose[@]}" down --volumes --remove-orphans; rm -f "$cookie_headers" "$compose_override"' EXIT
          "${compose[@]}" config --quiet
          "${compose[@]}" up \
            --detach --no-build --wait --wait-timeout 180
          curl --fail --silent http://127.0.0.1:18000/health/live
          curl --fail --silent http://127.0.0.1:18000/health/ready
          test "$(curl --fail --silent --show-error --dump-header - \
            --output /dev/null http://127.0.0.1:18000/ \
            | tr -d '\r' | grep --ignore-case '^strict-transport-security:')" = \
            'strict-transport-security: max-age=31536000'
          curl --fail --silent --show-error --dump-header "$cookie_headers" \
            --output /dev/null --header 'Content-Type: application/json' \
            --data '{"password":"ci-smoke-password"}' \
            http://127.0.0.1:18000/api/v1/auth/login
          session_cookie="$(sed -n 's/^[Ss]et-[Cc]ookie: flashcards_session=\([^;]*\).*/\1/p' "$cookie_headers" | tr -d '\r')"
          test -n "$session_cookie"
          grep --quiet --ignore-case '^set-cookie: .*httponly' "$cookie_headers"
          grep --quiet --ignore-case '^set-cookie: .*secure' "$cookie_headers"
          grep --quiet --ignore-case '^set-cookie: .*samesite=lax' "$cookie_headers"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Cookie: flashcards_session=$session_cookie" \
            http://127.0.0.1:18000/api/v1/auth/me)" = 200
          curl --fail --silent --output /dev/null --request POST \
            --header "Cookie: flashcards_session=$session_cookie" \
            http://127.0.0.1:18000/api/v1/auth/logout
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Cookie: flashcards_session=$session_cookie" \
            http://127.0.0.1:18000/api/v1/auth/me)" = 401
