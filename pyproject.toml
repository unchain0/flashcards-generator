[project]
name = "flashcards-generator"
version = "1.0.0"
description = "Gerador de flashcards usando NotebookLM"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "argon2-cffi>=23,<26",
    "asyncpg>=0.30,<1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "notebooklm-py[browser]==0.8.1",
    "platformdirs>=4,<5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.11.0",
    "playwright==1.61.0",
    "pypdf>=6.14.2",
    "rich>=15.0.0",
    "tiktoken>=0.14.0",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
    "litestar>=2.18,<3",
]

[project.scripts]
flashcards-web = "flashcards_generator.delivery.web.main:main"
flashcards-companion = "flashcards_generator.delivery.companion.main:main"

[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "pre-commit>=4.3.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=7.1.0",
  "pytest-timeout>=2.4.0",
  "python-dotenv>=1.2.1",
  "radon>=6.0.1",
  "ruff>=0.15.22",
  "taskipy>=1.14.1",
  "ty>=0.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flashcards_generator = [
  "delivery/web/static/dist/**/*",
]

[tool.ruff]
target-version = "py314"
line-length = 79
indent-width = 4
show-fixes = true
preview = true
extend-exclude = ["**/AGENTS.md"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short"]
markers = [
  "integration: marks tests as integration tests (slow)",
  "unit: marks tests as unit tests (fast)",
]

[tool.ty]

[tool.ty.environment]
python-version = "3.14"

[tool.taskipy.tasks]
format = "ruff format"
lint = "ruff check"
post_test = "coverage html"
pre_format = "ruff check --fix"
pre_test = "task lint"
quality-gate = "python scripts/python/quality_gate.py"
sonar-complex = "radon cc . --min B -nb -s --average"
sonar-maintain = "radon mi src/flashcards_generator/ --min B -nb -s"
sonar-report = "radon cc . -a -s --total-average && echo '---' && radon mi . -s && echo '---' && radon raw . -s"
test = "pytest -s -x --cov=flashcards_generator -vv"
typecheck = "ty check src/flashcards_generator"
