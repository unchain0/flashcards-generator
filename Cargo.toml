[workspace]
members = ["rust/domain", "rust/engines", "rust/services", "rust/integrations", "rust/delivery", "rust/xtask", "rust/integrations-shared", "rust/integrations-server", "rust/delivery-shared", "rust/delivery-server"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
excessive_nesting = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
regex = "1.13.1"
argon2 = { version = "0.5.3", features = ["std"] }
base64 = "0.22.1"
getrandom = { version = "0.3.4", features = ["std"] }
hmac = "0.12.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "migrate", "macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "io-util", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
sentry = { version = "0.49.3", default-features = false, features = ["backtrace", "panic", "reqwest", "rustls", "tracing"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "multipart"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3.27"
csv = "1.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "query", "stream", "cookies"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
html-escape = "0.2.15"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
rustix = { version = "1.1.5", features = ["process"] }
