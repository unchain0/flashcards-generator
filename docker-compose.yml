services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flashcards
      POSTGRES_USER: flashcards
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - flashcards-data:/var/lib/postgresql/data

  app:
    build:
      context: .
    environment:
      FLASHCARDS_ENVIRONMENT: production
      FLASHCARDS_SESSION_SECRET: ${SERVICE_REALBASE64_64_SESSIONSECRET}
      FLASHCARDS_AUTH_LOOKUP_SECRET: ${SERVICE_REALBASE64_64_AUTHLOOKUPSECRET}
      FLASHCARDS_BOOTSTRAP_PASSWORD: ${SERVICE_PASSWORD_64_BOOTSTRAP}
      FLASHCARDS_DATABASE_URL: postgresql+asyncpg://flashcards:${SERVICE_PASSWORD_64_POSTGRES}@db:5432/flashcards
      FLASHCARDS_AUTO_CREATE_SCHEMA: "false"
      FLASHCARDS_DATA_DIR: /app/data
      FLASHCARDS_CORS_ORIGINS: ${FLASHCARDS_CORS_ORIGINS:-[]}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    expose:
      - "8000"
    volumes:
      - flashcards-app-data:/app/data
    restart: unless-stopped

volumes:
  flashcards-data:
  flashcards-app-data:
